<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lockbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Keep this file ASCII only: api/app.py reads it with the system default encoding. -->
<style>
  :root {
    --bg:#F3F1EC; --panel:#FFFFFF; --ink:#121212; --mute:#6B675F; --line:#E2DED6; --soft:#F8F7F3;
    --bad:#E4572E; --ok:#1E7B4F; --grey:#A29E95;
    --b1:#121212; --b2:#4E4A44; --b3:#7E796F; --b4:#A7A298; --b5:#C6C1B7; --b6:#3A3733; --b7:#E2DED6;
    --sans: Archivo, "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:16px/1.45 var(--sans); font-variant-numeric:tabular-nums; padding-bottom:120px; }
  .mono { font-family:var(--mono); }
  .mute { color:var(--mute); }
  a { color:inherit; }
  .tight { font-weight:800; font-stretch:75%; letter-spacing:-.01em; }

  button { position:relative; font:600 15px var(--sans); padding:10px 14px; border-radius:4px; border:1px solid var(--ink); background:var(--panel); color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--soft); }
  button.pri { background:var(--ink); color:#fff; }
  button.pri:hover:not(:disabled) { background:#2b2b2b; }
  button:disabled, button.pri:disabled { background:transparent; color:var(--grey); border:1px dashed var(--line); cursor:not-allowed; }
  button.next { outline:3px solid var(--ink); outline-offset:3px; }
  button.next::after { content:attr(data-step); position:absolute; top:-14px; right:-12px; width:24px; height:24px; border-radius:50%;
    background:var(--ink); color:#fff; font:700 14px/24px var(--sans); text-align:center; }

  /* top bar */
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:24px; padding:14px 32px; background:var(--bg); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .top h1 { font-size:28px; margin:0; }
  .ledger { font-size:16px; font-weight:600; padding:4px 10px; border:1px solid var(--ink); border-radius:4px; background:var(--panel); }
  .top .addr { font:15px var(--mono); color:var(--mute); }
  .stateword { margin-left:auto; font-size:44px; line-height:1; }

  main { max-width:1856px; margin:0 auto; padding:24px 32px; display:flex; flex-direction:column; gap:24px; }
  section { border:1px solid var(--line); border-radius:4px; padding:22px 26px; background:var(--panel); min-width:0; }
  h2 { font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:0 0 16px; }
  .num { font-size:56px; line-height:1.05; }
  .num small { font:500 20px var(--sans); color:var(--mute); margin-left:6px; }
  .lab { font-size:16px; color:var(--mute); }
  .stat b { display:block; font-size:30px; font-weight:800; font-stretch:75%; }

  /* the referee */
  .ref { border:2px solid var(--ink); }
  .ref-head { display:flex; align-items:center; gap:16px; margin-bottom:12px; }
  .ref-head h2 { margin:0; color:var(--ink); }
  .ref-head .rb { font-size:15px; color:var(--mute); }
  .ref-head button { margin-left:auto; }
  .banner { display:grid; grid-template-columns:auto 1fr; gap:4px 36px; align-items:center; padding:22px 28px; border-left:12px solid var(--line); background:var(--soft); border-radius:4px; }
  .banner .word { font-size:150px; line-height:.95; grid-row:span 3; color:var(--grey); }
  .banner .what { font-size:34px; font-weight:700; line-height:1.2; }
  .banner .why { font-size:22px; }
  .banner .meta { font-size:15px; color:var(--mute); }
  .banner.ok { border-left-color:var(--ok); } .banner.ok .word { color:var(--ok); }
  .banner.bad { border-left-color:var(--bad); background:#FCEDE8; } .banner.bad .word { color:var(--bad); }
  .banner.flash { animation:flash .45s ease-in-out 4; }
  @keyframes flash { 50% { background:#F7C9BA; } }
  details summary { cursor:pointer; color:var(--mute); font-size:15px; }
  details.checks { margin-top:10px; }
  .clist { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:8px; font:14px var(--mono); }
  .clist .ok::before { content:"\2713  "; } .clist .no { color:var(--bad); } .clist .no::before { content:"\2717  "; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:14px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  td.res { font-weight:700; white-space:nowrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:1px; }
  .older { margin-top:18px; }
  .ask-row { display:flex; gap:12px; align-items:flex-start; margin-top:10px; }
  .ask-row button { padding:6px 12px; font-size:14px; }
  .ask-out { font-size:16px; line-height:1.45; max-width:72ch; }
  .ask-out .lab2 { display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin-bottom:2px; }
  .ask-out.wait, .ask-out.off { color:var(--grey); font-size:14px; padding-top:6px; }
  .ask-any { display:flex; gap:8px; margin-top:16px; }
  .ask-any input { flex:1; font:15px var(--sans); padding:9px 12px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink); min-width:0; }
  #verify { margin-top:16px; }
  .vhead { font-size:26px; margin-bottom:6px; }

  /* three columns */
  .cols { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:24px; }
  @media (max-width:1100px) { .cols { grid-template-columns:minmax(0, 1fr); } .banner { grid-template-columns:1fr; } .banner .word { font-size:84px; grid-row:auto; } }
  .bar { display:flex; height:28px; margin:18px 0 12px; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--soft); }
  .bar i { display:block; height:100%; transition:width .4s; }
  .legend { display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; font-size:16px; align-items:center; }
  .legend .sw { width:12px; height:12px; border-radius:2px; }
  .legend .v { text-align:right; font:500 15px var(--mono); }
  .fine { font-size:14px; color:var(--mute); margin-top:16px; line-height:1.6; }
  .fine .mono { color:var(--ink); }
  .status { display:flex; align-items:center; gap:10px; font-size:30px; text-transform:uppercase; }
  .status::before { content:""; width:6px; height:30px; background:var(--ink); }
  .dots { display:flex; gap:12px; margin:22px 0; flex-wrap:wrap; }
  .dots i { width:44px; height:44px; border-radius:50%; border:3px solid var(--b5); }
  .dots i.paid { background:var(--ink); border-color:var(--ink); }
  .dots i.next { border-color:var(--ink); }
  .dots i.lost { border-style:dashed; border-color:var(--b4); }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:18px 24px; }
  ol.losers { margin:8px 0 0; padding-left:22px; font-size:17px; line-height:1.7; }

  /* underwriting */
  details.uw > summary { list-style:none; font-size:24px; font-weight:700; color:var(--ink); }
  details.uw > summary::-webkit-details-marker { display:none; }
  details.uw > summary::before { content:"\25B8  "; color:var(--mute); }
  details.uw[open] > summary::before { content:"\25BE  "; }
  .uwgrid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:28px; margin-top:20px; }
  @media (max-width:1100px) { .uwgrid { grid-template-columns:minmax(0, 1fr); } }
  .hist { display:flex; align-items:flex-end; gap:6px; height:120px; border-bottom:1px solid var(--line); }
  .hist i { flex:1; background:var(--ink); min-height:3px; }
  .quotes { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
  .quote { border:1px solid var(--line); border-radius:4px; padding:14px 16px; }
  .quote .num { font-size:44px; }
  .quote.ours { border:2px solid var(--ink); }
  .quote .pair { gap:12px 20px; margin-top:6px; }
  .real-title { font-size:20px; font-weight:800; margin:26px 0 0; }
  table.real { margin-top:10px; }
  table.real td.n, table.real th:not(:first-child) { text-align:right; }
  table.real td.n { font-family:var(--mono); font-size:16px; white-space:nowrap; }
  table.real tr.save td { font-weight:800; font-size:18px; border-bottom:none; }
  .kv { display:grid; grid-template-columns:minmax(150px, auto) 1fr; gap:8px 18px; font-size:16px; align-content:start; }
  .kv dt { color:var(--mute); } .kv dd { margin:0; font-weight:500; }
  .kv dd.bad { color:var(--bad); }
  .kv dt.total, .kv dd.total { border-top:1px solid var(--ink); padding-top:6px; font-weight:800; color:var(--ink); }

  /* activity */
  .feed { list-style:none; margin:12px 0 0; padding:0; max-height:320px; overflow:auto; font-size:15px; }
  .feed li { padding:7px 0; border-bottom:1px solid var(--line); }
  .ticks { display:inline-flex; flex-wrap:wrap; gap:2px 14px; margin-left:6px; }
  .ticks .no { color:var(--bad); }

  /* pinned actions */
  .actions { position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--line); padding:14px 32px 12px; display:flex; gap:22px; flex-wrap:wrap; align-items:flex-end; }
  .grp { display:flex; flex-direction:column; gap:8px; }
  .grp > span { font-size:14px; color:var(--mute); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .grp .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .toast { position:fixed; bottom:120px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:4px; font-size:16px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; z-index:6; }
  .toast.on { opacity:1; }
  @media (max-width:700px) { .top, main, .actions { padding-left:16px; padding-right:16px; } .stateword { font-size:30px; } body { padding-bottom:300px; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="tight">Lockbox</h1>
  <span class="ledger" id="net">connecting</span>
  <span class="addr" id="addr"></span>
  <span class="stateword tight" id="stateword"></span>
</header>

<main>
  <section class="ref">
    <div class="ref-head">
      <h2>The referee</h2>
      <span class="rb" id="rb"></span>
      <button id="b-verify" class="pri" data-step="9">Verify the referee</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="ask-row" id="ask-row" style="display:none"><button id="b-why" title="An AI explains this decision. It never changes it.">Why?</button><div class="ask-out" id="ask-why"></div></div>
    <div id="hero-checks"></div>
    <div class="older"><table id="decisions"></table></div>
    <div class="ask-any"><input id="ask-q" maxlength="500" placeholder="Ask the auditor anything about this lockbox" aria-label="Ask the auditor anything"><button id="b-ask">Ask</button></div>
    <div class="ask-out" id="ask-any-out"></div>
    <div id="verify"></div>
  </section>

  <div class="cols">
    <section>
      <h2>Account</h2>
      <div class="num tight" id="bal">-<small>XRP</small></div>
      <div class="lab" id="frozen-why"></div>
      <div class="bar" id="stack"></div>
      <div class="legend" id="legend"></div>
      <div class="fine" id="signers"></div>
      <div class="fine" id="payees"></div>
    </section>
    <section>
      <h2>Loan</h2>
      <div id="loan"><div class="lab">No loan yet.</div></div>
    </section>
    <section>
      <h2>Lender side</h2>
      <div id="lender"></div>
    </section>
  </div>

  <section>
    <details class="uw" id="uw">
      <summary id="uw-line">Underwriting: no quote yet</summary>
      <div id="offer"></div>
    </details>
  </section>

  <section>
    <details>
      <summary>Ledger activity</summary>
      <ul class="feed" id="feed"><li class="mute">Nothing yet.</li></ul>
    </details>
  </section>
</main>

<div class="actions">
  <div class="grp"><span>Borrower</span><div class="btns">
    <button id="b-lock" class="pri" data-step="2">Lock account</button>
    <button id="b-own" data-step="5">Send loan to own wallet</button>
    <button id="b-sup" data-step="6">Pay supplier</button>
    <button id="b-free">Withdraw free cash</button>
    <button id="b-all" data-step="7">Withdraw all</button>
    <button id="b-payoff" data-step="8">Repay in full</button>
    <button id="b-release" data-step="8">Release account</button></div></div>
  <div class="grp"><span>Lender</span><div class="btns">
    <button id="b-quote" class="pri" data-step="3">Underwrite</button>
    <button id="b-borrow" class="pri" data-step="4">Make the loan</button></div></div>
  <div class="grp" id="g-sim"><span>Time (simulated)</span><div class="btns">
    <button id="b-adv1" data-step="7" title="Advance one 2-minute interval">Advance 2 min</button>
    <button id="b-adv2" data-step="7" title="Buyers stop paying, then advance one 2-minute interval">Stop sales</button>
    <button id="b-reset">Reset</button></div></div>
  <div class="grp" id="g-dev" style="display:none"><span>Autopilot (Devnet)</span><div class="btns">
    <button id="b-rev">Revenue: on</button><button id="b-auto">Servicer: on</button></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const xrp = d => (d / 1e6).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// one format everywhere: "59.64 XRP"; tiny amounts keep their digits instead of reading 0.00
const amt = d => { d = +d || 0; return Math.abs(d) > 0 && Math.abs(d) < 10000
  ? (d / 1e6).toFixed(6).replace(/0+$/, '') + ' XRP' : xrp(d) + ' XRP'; };
const short = a => a ? a.slice(0, 5) + '\u2026' + a.slice(-4) : '';
const mono = a => `<span class="mono">${esc(short(a))}</span>`;
const EXPLORER = 'https://devnet.xrpl.org/transactions/';
let since = 0, S = null, evs = [], heroId = null, verified = false, salesOn = true;

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 3200); }
async function post(path, body) {
  try {
    const r = await fetch('/api/' + path, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body || {})});
    const j = await r.json();
    if (!r.ok) { toast(j.detail || 'failed'); return null; }
    return j;
  } catch (e) { toast('request failed'); return null; }
}

// the deciding rule in plain words
const RULES = {
  within_principal: 'Loan money may pay an approved supplier, within its cap, with the invoice number on it.',
  within_free_cash: "Only earned free cash and the owner's own deposit may go to the owner's wallet.",
  covered_by_balance: 'Repayment comes first, as long as the XRP fee reserve stays in the account.',
  amount_matches_installment: 'A repayment must be the installment or an exact full payoff.',
  broker_rulebook_hash: 'The loan is under this published rulebook and matches the terms the borrower signed.',
  borrower_signed_terms: 'The borrower must have signed these exact terms.',
  agreement_hash_in_data: 'The signed agreement hash must be written on the loan.',
  ends_before_redemption: 'The loan, grace period included, must end before depositors can redeem.',
  nothing_owed: 'The account goes back to the borrower only when nothing is owed.',
  loan_repaid: 'The account goes back to the borrower only after the loan is repaid.',
  release_to_registered_key: "The account can only go back to the borrower's registered key.",
  within_recovery_cap: 'After a default the lender is paid what is still owed, no more.',
  recovery_after_default: 'The lender can only take money out after a default.',
  loan_current: 'No withdrawals while a payment is past due.',
  revenue_covers_installment: 'No withdrawals after sales fell short of the installment two intervals in a row.',
  not_in_default: 'After a default nothing goes to the owner until the lender is repaid.',
  destination_allowlisted: "Money may only go to the owner's wallet, an approved supplier or the lender.",
  within_payee_cap: 'Each supplier has a cap set by the lender.',
  invoice_memo: 'A supplier payment must carry its invoice number.',
  payoff_while_current: 'A full payoff is only allowed while the loan is not past due.',
  payoff_within_funds: 'A full payoff may not use the bond or the fee reserve.',
  no_open_loan: 'One loan at a time.',
  one_approval_at_a_time: 'The referee hands out one approval at a time.',
  last_ledger_window: 'An approval is only valid for about 40 seconds.',
  sequence_is_next: 'An approval is only valid for the next transaction from the account.',
  fee_cap: 'Transaction fees are capped.',
  no_forbidden_fields: 'No fields that could change where the money goes.',
  type: 'Only payments, repayments, the loan itself and the release are allowed.',
};
// a refusal explains itself: the referee's own words when it names what the payment would dip into
function ruleText(e) {
  if (!e.allowed) {
    const c = (e.checks || []).find(c => c.name === e.rule && !c.ok);
    if (c && /^[A-Z]/.test(c.detail || '')) return c.detail;
  }
  return RULES[e.rule] || (e.rule ? e.rule.replace(/_/g, ' ') : '');
}

function who(a) {
  if (!S || !a) return short(a);
  if (S.approved_payees && S.approved_payees[a]) return 'approved supplier ' + S.approved_payees[a].invoice_ref;
  if (a === S.payout_address) return "the owner's own wallet";
  if (a === S.lender_address) return 'the lender';
  if (a === S.lockbox.address) return 'the lockbox';
  return short(a);
}
const isDry = e => e.kind === 'verdict' && +e.amount === 1;  // a 1-drop approval is a dry run or a test, not a real payment
// The AI auditor only explains a decision the referee already made. Its answer is shown, never used.
async function askAuditor(question, out) {
  out.className = 'ask-out wait'; out.textContent = 'Asking the auditor...';
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
    const r = await fetch('/api/ask', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({question}), signal: ctl.signal});
    clearTimeout(t);
    const j = await r.json();
    if (!r.ok || !j.answer) throw new Error(j.error || 'no answer');
    out.className = 'ask-out';
    out.innerHTML = `<span class="lab2">AI auditor (explains, doesn't decide)</span>${esc(j.answer)}`;
  } catch (e) { out.className = 'ask-out off'; out.textContent = 'Auditor unavailable'; }
}

function askWhy() {
  const h = evs.filter(e => e.kind === 'verdict' && !isDry(e)).reverse()[0];
  if (!h) return;
  askAuditor(`Explain in two or three plain-English sentences why the referee ${h.allowed ? 'signed' : 'refused'} this transaction: ${sentence(h)}, deciding rule ${h.rule}.`, $('ask-why'));
}

function askAnything() {
  const q = $('ask-q').value.trim();
  if (q) askAuditor(q, $('ask-any-out'));
}

function sentence(e) {
  const a = e.amount ? amt(e.amount) : '';
  if (e.tx === 'Payment') return `${a} to ${who(e.to)}${S && e.to === S.lender_address ? ' (recovery)' : ''}`;
  if (e.tx === 'LoanPay') return `${a} repayment to the lender`;
  if (e.tx === 'LoanSet') return `Loan of ${a} into the lockbox`;
  if (e.tx === 'SetRegularKey') return 'Hand the account back to the borrower';
  return `${e.tx} ${a}`;
}
const ago = ts => { if (!S || !ts) return ''; const s = S.now - ts; return s < 60 ? `${Math.max(0, s)} s ago` : `${Math.round(s / 60)} min ago`; };
// Devnet only: the explorer page of the transaction a signed decision became
function txLink(e) {
  if (!S || S.mode === 'sim' || !e.allowed || !e.decision) return '';
  const t = e.decision.tx || {};
  const sub = evs.find(x => x.kind === 'submitted' && x.account === t.Account && x.sequence === t.Sequence && x.hash);
  return sub ? `<a class="mono" href="${EXPLORER}${esc(sub.hash)}" target="_blank" rel="noopener">${esc(sub.hash.slice(0, 8))}</a>` : '';
}

function stateWord() {
  const lb = S.lockbox;
  if (lb.master_disabled && !Object.keys(lb.signers || {}).length && lb.regular_key) return ['RELEASED', 'var(--ok)'];
  if (!lb.master_disabled) return ['NOT LOCKED', 'var(--grey)'];
  if ((S.frozen || []).length) return ['FROZEN', 'var(--bad)'];
  return ['OPEN', 'var(--ink)'];
}

const PARTS = [
  ['earned_free_cash', 'Earned free cash', 'var(--b1)'], ['owner_funds', "Owner's own money", 'var(--b2)'],
  ['unspent_principal', 'Unspent loan money', 'var(--b6)'], ['installment_reserve', 'Next installment', 'var(--b3)'],
  ['holdback', 'Holdback', 'var(--b4)'], ['bond', 'Bond', 'var(--b5)'],
  ['reserve', 'Ledger reserve', 'var(--b7)'], ['fee_buffer', 'Fee buffer', 'var(--b7)'],
];

const FREEZE = ['not_in_default', 'loan_current', 'revenue_covers_installment'];
// the owner tried to withdraw while frozen and the referee refused, since the latest loan
function frozenRefused() {
  const loanAt = (evs.filter(e => e.kind === 'loan_set').pop() || {i: Infinity}).i;
  return evs.some(e => e.kind === 'verdict' && !isDry(e) && e.to === S.payout_address && !e.allowed && FREEZE.includes(e.rule) && e.i > loanAt);
}
// the referee's payoff rule: the full payoff must fit in the balance minus the ledger reserve, fee buffer and bond
function canPayOff() {
  const L = S.loan, bk = S.buckets || {};
  if (!L || !L.owed) return false;
  const fee = (S.offer && S.offer.service_fee) || 0;
  return L.owed + fee <= S.lockbox.balance - (bk.reserve || 0) - (bk.fee_buffer || 0) - (bk.bond || 0);
}
// the next step of DEMO.md, highlighted on its button
function nextStep() {
  if (!S || S.mode !== 'sim') return null;
  const lb = S.lockbox, bk = S.buckets || {};
  if (!lb.master_disabled) return Object.keys(lb.signers || {}).length || lb.regular_key ? null : 'b-lock';
  if (!S.has_loan && !S.has_offer) return 'b-quote';
  if (!S.has_loan) return S.offer && S.offer.approved ? 'b-borrow' : null;
  const after = kind => { const x = evs.filter(e => e.kind === kind).pop(); return x ? x.i : Infinity; };
  const toOwner = e => e.kind === 'verdict' && !isDry(e) && e.to === S.payout_address;
  const loanAt = after('loan_set');
  const refusedOwn = evs.some(e => toOwner(e) && !e.allowed && e.i > loanAt);
  if (bk.unspent_principal > 0) return refusedOwn ? 'b-sup' : 'b-own';
  // paid off early: hand the account back, then let anyone check the referee
  if (S.status === 'paid') return Object.keys(lb.signers || {}).length ? 'b-release' : verified ? null : 'b-verify';
  if (S.status !== 'defaulted') {
    if (!['current', 'late', 'impaired', 'defaultable'].includes(S.status)) return null;
    const frozen = (S.frozen || []).length;
    const frozenRefusal = frozenRefused();
    // sales stop, the account freezes, withdrawing everything is refused
    if (!frozenRefusal) return salesOn ? 'b-adv2' : frozen ? 'b-all' : 'b-adv1';
    // sales come back, the freeze lifts, and once the cash covers it the borrower pays off early
    if (!salesOn) return 'b-adv2';
    return !frozen && canPayOff() ? 'b-payoff' : 'b-adv1';
  }
  return verified ? null : 'b-verify';
}

const when = t => { if (!t || !S) return '-'; const m = Math.round((t - S.now) / 60); return m > 0 ? `in ${m} min` : m < 0 ? `${-m} min ago` : 'now'; };
function ivWord(sec) {
  if (sec === 86400) return 'daily';
  if (sec === 604800) return 'weekly';
  if (sec >= 2419200 && sec <= 2678400) return 'monthly';
  return sec % 60 === 0 ? `${sec / 60}-minute` : `${sec}-second`;
}
const part = x => ({2: 'half', 3: 'a third', 4: 'a quarter'}[x] || `1/${x}`);

// "history 7 of 12 intervals: 15/25" and friends, as label and value
function reasonRow(r, o) {
  let m;
  const pts = (a, b) => ` <span class="mute">(${a} of ${b} points)</span>`;
  const iv = ivWord((S && S.interval) || 0);
  if ((m = r.match(/^history (\d+) of (\d+) intervals: (\d+)\/(\d+)$/))) return ['History', `${m[1]} of ${m[2]} intervals` + pts(m[3], m[4])];
  if ((m = r.match(/^inflow volatility \(std\/mean\) ([\d.]+): (\d+)\/(\d+)$/))) return ['Volatility', `${m[1]} (spread over average)` + pts(m[2], m[3])];
  if ((m = r.match(/^(\d+) paying sender\(s\), largest share (\d+%): (\d+)\/(\d+)$/))) return ['Buyers', `${m[1]} paying, largest is ${m[2]}` + pts(m[3], m[4])];
  if ((m = r.match(/^last interval at (\d+%) of the average: (\d+)\/(\d+)$/))) return ['Latest interval', `${m[1]} of the average` + pts(m[2], m[3])];
  if ((m = r.match(/^sender (r\w+) is (\d+%) of revenue, counted at (\d+%)$/))) return ['Buyer cap', `${mono(m[1])} is ${m[2]} of sales, counted at ${m[3]}`];
  if ((m = r.match(/^ignored sender (r\w+): (.*)$/))) return ['Ignored buyer', `${mono(m[1])} ${esc(m[2])}`];
  if ((m = r.match(/^average inflow ([\d.]+) XRP per interval, conservative ([\d.]+) XRP$/)))
    return ['Average sales', `${(+m[1]).toFixed(2)} XRP per interval, cautious ${(+m[2]).toFixed(2)} XRP`];
  if ((m = r.match(/^installment kept at or below conservative inflow \/ ([\d.]+)$/))) return ['Coverage', `Installment is at most ${part(+m[1])} of cautious ${iv} sales`];
  if ((m = r.match(/^tier (\w): rate ([\d.]+)% a year$/))) return ['Tier', `${m[1]}, ${m[2]}% a year`];
  if (r.startsWith('stress:') && o.stress && o.stress.stressed_coverage != null)
    return ['Stress test', `sales down ${o.stress.revenue_drop_pct}%: still covers the installment ${o.stress.stressed_coverage.toFixed(2)} times${o.stress.still_covered ? '' : ', not enough'}`];
  if ((m = r.match(/^graduation: (.*)$/))) return ['Graduation', esc(m[1])];
  const i = r.indexOf(': ');
  return i > 0 ? [esc(r.slice(0, i)), esc(r.slice(i + 2))] : ['Note', esc(r)];
}

function quoteBox(title, ok, drops, rate, ours) {
  return `<div class="quote${ours ? ' ours' : ''}"><div class="lab">${title}</div>${ok
    ? `<div class="pair"><div><div class="lab">Can borrow up to</div><div class="num tight">${xrp(drops)}<small>XRP</small></div></div>
       <div><div class="lab">Rate</div><div class="num tight">${(rate || 0).toFixed(1)}<small>% a year</small></div></div></div>`
    : '<div class="num tight">declined</div>'}</div>`;
}
function unlockedLine(o, u) {
  const f = o.principal ? (u.principal_drops || 0) / o.principal : 0;
  const share = Math.abs(f - 0.5) < 0.001 ? 'half' : `${Math.round(f * 100)}% of`;
  const pts = ((u.rate_pct || 0) - (o.rate_pct || 0)).toFixed(1).replace(/\.0$/, '');
  return `Without a lockbox the lender can't stop money leaving, so they lend less and charge more. Our assumptions: ${share} the limit, +${pts} points.`;
}
// a level-payment loan: monthly rate = annual / 12
function amortize(principal, annualPct, n) {
  const r = annualPct / 100 / 12;
  const pay = r ? principal * r / (1 - Math.pow(1 + r, -n)) : principal / n;
  return {pay, interest: pay * n - principal};
}
// the same quote at a human scale: one interval read as one month, 1 XRP read as $1,000
function realLife(o, u) {
  if (!o.approved || !u.approved || !o.payment_total) return '';
  const usd = x => '$' + Math.round(x).toLocaleString('en-US');
  const n = o.payment_total, ours = o.principal / 1e6 * 1000, theirs = u.principal_drops / 1e6 * 1000;
  const a = amortize(theirs, o.rate_pct, n), b = amortize(theirs, u.rate_pct, n);
  const save = b.interest - a.interest, savePct = b.interest ? Math.round(save / b.interest * 100) : 0;
  const iv = ivWord(o.payment_interval || (S && S.interval) || 0);
  return `<h3 class="real-title">Same business in real life</h3>
    <div class="fine" style="margin-top:2px">Illustration: each ${iv} interval read as one month, 1 XRP read as $1,000. Not real money or market data.</div>
    <table class="real">
      <tr><th></th><th>With Lockbox</th><th>Without Lockbox</th></tr>
      <tr><td>Can borrow up to</td><td class="n">${usd(ours)}</td><td class="n">${usd(theirs)}</td></tr>
      <tr><td>Rate</td><td class="n">${o.rate_pct.toFixed(1)}%</td><td class="n">${u.rate_pct.toFixed(1)}%</td></tr>
      <tr><td>Monthly payment on the Lockbox loan</td><td class="n">${usd(amortize(ours, o.rate_pct, n).pay)}</td><td class="n mute">-</td></tr>
      <tr><td>Interest on the same ${usd(theirs)} over ${n} months</td><td class="n">${usd(a.interest)}</td><td class="n">${usd(b.interest)}</td></tr>
      <tr class="save"><td colspan="3">You save ${usd(save)} (${savePct}% less interest)</td></tr>
    </table>`;
}

function renderOffer(o) {
  if (!o) { $('uw-line').textContent = 'Underwriting: no quote yet'; $('offer').innerHTML = ''; return; }
  const u = o.unlocked || {};
  const pct = x => (x || 0).toFixed(1) + '%';
  $('uw-line').textContent = o.approved
    ? `Approved, tier ${o.tier}, ${amt(o.principal)} at ${pct(o.rate_pct)}` + (u.approved ? ` (without Lockbox: ${amt(u.principal_drops)} at ${pct(u.rate_pct)})` : '')
    : `Declined: ${(o.declines || [])[0] || 'see reasons'}`;
  const mx = Math.max(1, ...o.buckets);
  const rows = o.reasons.map(r => reasonRow(r, o));
  // the four scored parts first, then their total, then everything else
  const scored = rows.filter(r => / points\)/.test(r[1])), rest = rows.filter(r => !/ points\)/.test(r[1]));
  const g = o.graduation || {};
  const list = scored.concat([['Score', `${o.score} of 100`, 'total']], rest, (o.declines || []).map(r => ['Declined', esc(r), 'bad']));
  if (!g.repaid_loans) list.push(['Graduation', `no loans repaid on the ledger yet, limit x${g.multiplier || 1}`]);
  $('offer').innerHTML = `<div class="uwgrid">
    <div>
      <div class="lab" style="margin-bottom:8px">Buyer payments per interval, oldest to newest</div>
      <div class="hist">${o.buckets.map(v => `<i style="height:${Math.max(2, v / mx * 100)}%" title="${amt(v)}"></i>`).join('')}</div>
      <div class="quotes">${quoteBox('With Lockbox', o.approved, o.principal, o.rate_pct, true)}${quoteBox('Without Lockbox', u.approved, u.principal_drops, u.rate_pct, false)}</div>
      <div class="fine">${unlockedLine(o, u)}</div>
      ${realLife(o, u)}
    </div>
    <dl class="kv">${list.map(([k, v, cls]) => `<dt class="${cls || ''}">${k}</dt><dd class="${cls || ''}">${v}</dd>`).join('')}</dl>
  </div>`;
}

    `<tr><td class="mute">${ago(e.ts)}</td><td>${esc(sentence(e))}</td>
     <td class="res" style="color:var(--${e.allowed ? 'ok' : 'bad'})"><span class="dot" style="background:var(--${e.allowed ? 'ok' : 'bad'})"></span>${e.allowed ? 'Signed' : 'Refused'}</td>
     <td>${esc(ruleText(e))}</td>${devnet ? `<td>${txLink(e)}</td>` : ''}</tr>`).join('') : '';
}

// ledger activity in plain English
const LOCK_TEXT = {SignerListSet: 'Keys set: referee 2, borrower 1, lender 1, need 3', AccountSet: 'Master key switched off'};
function activity(e) {
  const t = {
    loan_pay: e => `${e.late ? 'Late ' : ''}installment ${e.ok ? 'collected' : 'failed ' + e.code}: ${amt(e.drops)}`,
    loan_set: e => `Loan ${e.ok ? 'made' : 'failed ' + e.code}: ${amt(e.principal)}`,
    impair: e => 'Loan marked impaired (paper loss booked in the vault)',
    default: e => `Loan defaulted. First-loss cover paid ${e.covered ? amt(e.covered) : '?'} of ${e.loss ? amt(e.loss) : '?'}`,
    recovery: e => `Recovery to the lender: ${amt(e.drops)}`, short: e => `Lockbox short: has ${amt(e.balance)}, needs ${amt(e.need)}`,
    blocked: e => `Referee refused ${e.tx}: ${e.reason}`,
    lock: e => e.ok ? (LOCK_TEXT[e.tx] || `${e.tx} done`) : `${e.tx} failed ${e.code}`,
    withdraw: e => `Withdrawal ${amt(e.drops)} ${e.ok ? 'sent' : 'failed ' + e.code}`,
    quote: e => `Quote: ${e.approved ? 'approved' : 'declined'}, tier ${e.tier}, score ${e.score}`, error: e => 'Error: ' + e.msg,
    pay_payee: e => `Paid supplier ${short(e.to)} ${amt(e.drops)}, invoice ${e.invoice} ${e.ok ? '' : '(failed ' + e.code + ')'}`,
    pay_off: e => `Full payoff ${e.ok ? 'done' : 'failed ' + e.code}: ${amt(e.drops)}`,
    release_regular_key: e => `Release step 1, borrower's key set: ${e.ok ? 'done' : 'failed ' + e.code}`,
    release_signer_list: e => `Release step 2, signer list removed: ${e.ok ? "done, the account is the borrower's again" : 'failed ' + e.code}`,
    approve_payee: e => `Lender approved supplier ${short(e.to)}, cap ${amt(e.cap)}, invoice ${e.invoice}`,
  }[e.kind];
  if (e.kind === 'verify_lockbox')
    return 'Lender checked the lock:<span class="ticks">' + (e.checks || []).map(c =>
      `<span class="${c.ok ? '' : 'no'}">${c.ok ? '&#10003;' : '&#10007;'} ${esc(c.name)}</span>`).join('') + '</span>';
  return esc(t ? t(e) : e.kind);
}

function renderFeed() {
  renderDecisions();
  const items = evs.filter(e => ['loan_pay', 'loan_set', 'impair', 'default', 'recovery', 'short', 'blocked', 'verify_lockbox', 'lock', 'withdraw', 'quote', 'error',
    'pay_payee', 'pay_off', 'release_regular_key', 'release_signer_list', 'approve_payee'].includes(e.kind)).slice(-40).reverse();
  $('feed').innerHTML = items.length ? items.map(e => `<li><span class="mute">${ago(e.ts)}</span>&nbsp;&nbsp;${activity(e)}</li>`).join('')

async function verifyReferee() {
  verified = true; render();
  $('verify').innerHTML = '<div class="lab">Checking the rulebook against the ledger and replaying every decision\u2026</div>';
  try {
    const r = await fetch('/api/verify'); const j = await r.json();
    if (!r.ok) { $('verify').innerHTML = `<div class="lab" style="color:var(--bad)">${esc(j.detail || 'verify failed')}</div>`; return; }
    const rb = j.rulebook;
    const tx = s => esc(s).replace(/(\d+) drops/, (_, d) => amt(+d) + (+d === 1 ? ' (dry run)' : ''));
    const rows = j.rows.map(x => `<tr><td class="mute">${x.n}</td><td>${tx(x.tx)}</td><td>${x.logged === 'allowed' ? 'Signed' : 'Refused'}</td>
      <td class="mono" style="font-size:14px">${esc(x.rule)}</td><td class="res" style="color:var(--${x.matches ? 'ink' : 'bad'})">${x.matches ? 'Matches' : 'DOES NOT MATCH'}</td></tr>`).join('');
    $('verify').innerHTML = `<div class="vhead tight" style="color:var(--${j.ok ? 'ink' : 'bad'})">${j.ok ? 'Verified: every referee decision matched its rules' : 'Mismatch found'}</div>
      <div class="lab">On the ${esc(j.ledger)}. Rulebook ${esc(rb.name)} v${esc(rb.version)}: file <span class="mono">${esc((rb.fingerprint || '').slice(0, 12))}\u2026</span>,
        ledger <span class="mono">${esc((rb.on_ledger || 'empty').slice(0, 12))}\u2026</span>, ${rb.matches ? 'same' : 'DIFFERENT'}.${rb.problems.length ? ' ' + rb.problems.map(esc).join(' ') : ''}</div>
      ${j.rows.length ? `<table style="margin-top:10px"><tr><th>#</th><th>Transaction</th><th>Referee</th><th>Deciding rule</th><th>Replay</th></tr>${rows}</table>` : '<div class="lab">No decisions logged yet.</div>'}`;
  } catch (e) { $('verify').innerHTML = '<div class="lab" style="color:var(--bad)">verify request failed</div>'; }
}

async function poll() {
  try {
    S = await (await fetch('/api/state')).json();
    const ne = await (await fetch('/api/events?since=' + since)).json();
    if (ne.length) { evs = evs.concat(ne); since = ne[ne.length - 1].i; }
    render(); renderFeed();
  } catch (e) { $('net').textContent = 'offline'; }
}

const act = (id, fn) => $(id).addEventListener('click', async () => {
  $(id).disabled = true;  // no double clicks while the ledger works
  const r = await fn();
  $(id).disabled = false;  // render() then disables it again if the state says so
  await poll(); if (r) renderResult(r);
});
function renderResult(r) { if (r.verdict) toast(r.verdict.allowed ? 'Signed: ' + (r.ok ? 'sent' : 'rejected by the ledger') : 'Refused by the referee'); }
function resetView() {
  evs = []; since = 0; heroId = null; verified = false; salesOn = true;
  $('feed').innerHTML = ''; $('decisions').innerHTML = ''; $('verify').innerHTML = ''; $('hero-checks').innerHTML = '';
  $('ask-why').innerHTML = ''; $('ask-any-out').innerHTML = ''; $('ask-row').style.display = 'none';
  $('banner').className = 'banner';
}
act('b-lock', () => post('lock')); act('b-quote', () => post('quote')); act('b-borrow', () => post('borrow'));
act('b-free', () => post('withdraw', {mode: 'free'})); act('b-all', () => post('withdraw', {mode: 'all'}));
act('b-sup', () => post('pay_supplier')); act('b-own', () => post('own_wallet'));
$('b-why').addEventListener('click', askWhy);
$('b-ask').addEventListener('click', askAnything);
$('ask-q').addEventListener('keydown', e => { if (e.key === 'Enter') askAnything(); });
$('b-verify').addEventListener('click', verifyReferee);
act('b-payoff', () => post('payoff')); act('b-release', () => post('release'));
// one click is one payment interval; while sales are stopped no buyer pays
const IV = () => (S && S.interval) || 120;
act('b-adv1', () => post('advance', {seconds: IV(), revenue_xrp: salesOn ? 10 : 0}));
act('b-adv2', async () => { if (!salesOn) { salesOn = true; render(); return null; } salesOn = false; return post('advance', {seconds: IV(), revenue_xrp: 0}); });
act('b-reset', async () => { resetView(); return post('reset'); });
act('b-rev', () => post('auto', {revenue: !(S.auto && S.auto.revenue)})); act('b-auto', () => post('auto', {autopilot: !(S.auto && S.auto.autopilot)}));
if (location.hash === '#underwriting') { $('uw').open = true; $('uw').parentElement.style.order = -1; }  // link straight to the open panel, shown first
poll(); setInterval(poll, 1500);
</script>
</body>
</html>
